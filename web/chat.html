<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Buddy — AI Space Chat Assistant</title>
  <meta name="description" content="Ask Space Buddy anything about ISRO, Chandrayaan, Gaganyaan, rockets, and Indian space startups. Text or speak in your own language.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛰️</text></svg>">
  <style>
    /* WhatsApp-Style Cosmic Layout */
    .chat-wrapper {
      max-width: 800px;
      margin: 1.5rem auto;
      height: calc(100vh - 120px);
      display: flex;
      flex-direction: column;
      background: rgba(11, 15, 25, 0.85);
      border: 1px solid var(--border-glow);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(20px);
    }
    .chat-header {
      padding: 0.85rem 1.25rem;
      background: rgba(17, 24, 39, 0.95);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .bot-profile {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .bot-avatar-header {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-saffron), var(--primary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.4);
    }
    .bot-name {
      font-weight: 700;
      font-size: 1.05rem;
    }
    .bot-status {
      font-size: 0.75rem;
      color: #10b981;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .bot-status::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
    }

    /* Message Area */
    .chat-messages {
      flex-grow: 1;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background-image: radial-gradient(circle at center, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 0.6rem;
      max-width: 85%;
    }
    .msg-user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .msg-bot {
      align-self: flex-start;
    }
    .bot-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      flex-shrink: 0;
    }
    .msg-bubble {
      padding: 0.85rem 1.15rem;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.5;
      position: relative;
    }
    .msg-bubble-user {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #ffffff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
    }
    .msg-bubble-bot {
      background: rgba(30, 41, 59, 0.9);
      color: #f1f5f9;
      border: 1px solid var(--border-subtle);
      border-bottom-left-radius: 4px;
    }
    .msg-time {
      font-size: 0.65rem;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 0.35rem;
      text-align: right;
    }
    .msg-sources {
      margin-top: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }
    .source-chip {
      font-size: 0.72rem;
      background: rgba(6, 182, 212, 0.12);
      color: #38bdf8;
      border: 1px solid rgba(6, 182, 212, 0.3);
      padding: 0.15rem 0.5rem;
      border-radius: var(--radius-full);
      text-decoration: none;
    }
    .chat-audio-player {
      margin-bottom: 0.5rem;
    }
    .chat-inline-audio {
      height: 36px;
      outline: none;
    }

    /* Composer */
    .chat-composer {
      padding: 0.85rem 1.25rem;
      background: rgba(17, 24, 39, 0.95);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      position: relative;
    }
    .chat-input {
      flex-grow: 1;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-subtle);
      color: #fff;
      padding: 0.75rem 1.15rem;
      border-radius: var(--radius-full);
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .chat-input:focus {
      border-color: var(--primary);
    }
    .btn-composer {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .btn-send {
      background: var(--primary);
      color: #ffffff;
    }
    .btn-send:hover {
      background: #4f46e5;
      transform: scale(1.05);
    }
    .btn-mic {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
    }
    .btn-mic:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    .btn-mic.recording {
      background: var(--danger);
      color: #fff;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.6);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    .recording-banner {
      display: none;
      position: absolute;
      top: -36px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(239, 68, 68, 0.9);
      color: #fff;
      padding: 0.35rem 0.85rem;
      border-radius: var(--radius-full);
      font-size: 0.78rem;
      font-weight: 700;
      align-items: center;
      gap: 0.5rem;
    }

    /* Typing Dots */
    .typing-dots span {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #a5b4fc;
      margin: 0 2px;
      animation: typing 1.4s infinite both;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="header-container">
      <a href="/" class="brand-logo">
        <div class="brand-icon">🛰️</div>
        <div>
          <span class="brand-text">SPACE BHARAT</span>
          <span class="brand-badge">ISRO PR</span>
        </div>
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="/" class="nav-link">Library</a></li>
          <li><a href="/chat.html" class="nav-link active">Space Buddy Chat</a></li>
          <li><a href="/about.html" class="nav-link">About</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <select id="chat-lang-select" class="lang-select" aria-label="Select Chat Language">
          <option value="en-IN">English</option>
          <option value="hi-IN">हिन्दी (Hindi)</option>
          <option value="ta-IN">தமிழ் (Tamil)</option>
          <option value="te-IN">తెలుగు (Telugu)</option>
          <option value="bn-IN">বাংলা (Bengali)</option>
        </select>
      </div>
    </div>
  </header>

  <main style="padding: 0 1rem;">
    <div class="chat-wrapper">
      <div class="chat-header">
        <div class="bot-profile">
          <div class="bot-avatar-header">🛰️</div>
          <div>
            <div class="bot-name">Space Buddy</div>
            <div class="bot-status">Online · Ready to answer</div>
          </div>
        </div>
        <div style="font-size: 0.8rem; color: var(--text-dim);">
          RAG Verified Knowledge Base
        </div>
      </div>

      <div id="chat-messages" class="chat-messages">
        <!-- Messages rendered by chat.js -->
      </div>

      <div class="chat-composer">
        <div id="recording-indicator" class="recording-banner">
          <span>● Recording audio note...</span>
          <span id="record-timer">0:00</span>
        </div>

        <form id="chat-form" style="display: flex; align-items: center; gap: 0.75rem; width: 100%;">
          <input type="text" id="chat-text-input" class="chat-input" placeholder="Ask a question about ISRO or Indian space missions..." autocomplete="off" maxlength="500" />
          
          <button type="submit" class="btn-composer btn-send" id="btn-send-text" title="Send message" aria-label="Send message">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>

          <button type="button" class="btn-composer btn-mic" id="btn-mic" title="Hold or tap to speak (max 30s)" aria-label="Record voice note">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
          </button>
        </form>
      </div>
    </div>
  </main>

  <script type="module" src="/js/chat.js"></script>
</body>
</html>
