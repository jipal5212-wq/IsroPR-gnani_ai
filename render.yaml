services:
  - type: web
    name: isropr-gnani-ai
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GNANI_BASE_URL
        value: https://api.vachana.ai
      - key: LLM_PROVIDER
        value: openai-compatible
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: GNANI_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true

